services:

  mongodb:
    image: mongo:7
    container_name: food-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: food-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/foodordering
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001
    container_name: food-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mongodb_data: