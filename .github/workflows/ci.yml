name: Food Ordering CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # JOB 1 - FRONTEND BUILD

  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        run: npm ci


      - name: Build frontend
        run: npm run build

  # JOB 2 - BACKEND TEST

  backend:
    name: Backend Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json


      - name: Install backend dependencies
        run: npm ci


      - name: Run backend tests
        run: npm test


  # JOB 3 - DOCKER BUILD + GHCR PUSH

  docker:
    name: Build Docker Images and Push to GHCR

    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    permissions:
      contents: read
      packages: write

    steps:

      # Checkout

      - name: Checkout repository
        uses: actions/checkout@v4

      # Login to GitHub Container Registry

      - name: Login to GHCR

        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Backend Docker Image

      - name: Build backend Docker image

        run: |

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/food-ordering-backend:latest \
            ./backend

      # Push Backend Image to GHCR
  
      - name: Push backend image to GHCR

        run: |

          docker push \
            ghcr.io/${{ github.repository_owner }}/food-ordering-backend:latest


      # Build Frontend Docker Image

      - name: Build frontend Docker image

        run: |

          docker build \
            --build-arg VITE_API_URL=http://localhost:5000 \
            -t ghcr.io/${{ github.repository_owner }}/food-ordering-frontend:latest \
            ./frontend


      # Push Frontend Image to GHCR

      - name: Push frontend image to GHCR

        run: |

          docker push \
            ghcr.io/${{ github.repository_owner }}/food-ordering-frontend:latest